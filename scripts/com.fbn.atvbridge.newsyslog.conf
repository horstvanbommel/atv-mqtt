# Rotation fuer die von launchd umgeleiteten stdout/stderr-Streams
# (com.fbn.atvbridge.plist StandardOutPath/StandardErrorPath). Das Skript
# selbst loggt nur nach stdout/stderr und schreibt keine eigene Logdatei.
#
# Installation:
#   sudo cp scripts/com.fbn.atvbridge.newsyslog.conf /etc/newsyslog.d/
#
# logfilename        [owner:group]  mode  count  size(KB)  when  flags
/tmp/atvbridge.out                   644   5      5000      *     J
/tmp/atvbridge.err                   644   5      5000      *     J
